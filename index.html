<html lang="th">
<head>
    <link rel="icon" type="image/png" href="AAA.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST store </title>
    <style>
        /* สไตล์หมวดหมู่ที่เพิ่มใหม่ */
.category-box {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}
.category-tag {
    background: #ffffff;
    border: 1px solid #ddd;
    padding: 6px 15px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.3s;
    color: #333;
    text-decoration: none;
}
.category-tag:hover {
    background: #008cba;
    color: white;
    border-color: #008cba;
}
        /* ปุ่ม 3 ขีด */
.menu-icon {
    font-size: 30px;
    cursor: pointer;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 999;
    background: white;
    padding: 5px 10px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* แถบเมนูข้างๆ (Side Nav) */
.sidenav {
    height: 100%;
    width: 0; /* เริ่มต้นให้ซ่อนไว้ */
    position: fixed;
    z-index: 101;
    top: 0;
    left: 0;
    background-color: #111;
    overflow-x: hidden;
    transition: 0.5s; /* ความเร็วตอนเลื่อนออกมา */
    padding-top: 60px;
}

.sidenav a {
    padding: 15px 32px;
    text-decoration: none;
    font-size: 20px;
    color: #818181;
    display: block;
    transition: 0.3s;
}

.sidenav a:hover { color: #f1f1f1; }

.sidenav .closebtn {
    position: absolute;
    top: 0;
    right: 25px;
    font-size: 36px;
    margin-left: 50px;
}
        /* สไตล์ของช่องค้นหา */
.search-container {
    text-align: center;
    margin-bottom: 30px;
}
#searchInput {
    width: 80%;
    max-width: 400px;
    padding: 12px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 25px; /* ขอบมน */
    outline: none;
}
#searchInput:focus { border-color: #008cba; }
        /* ส่วนการตกแต่ง (CSS) */
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #333; }
        
        /* การจัดวางสินค้า */
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
        }
        
        /* กล่องสินค้า */
        .product-card { 
            background: white; padding: 15px; border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center;
        }
        .product-card img { max-width: 100%; border-radius: 5px; height: 200px; object-fit: cover; }
        .price { color: #0a0205; font-size: 1.2em; font-weight: bold; }
        .buy-button { 
            display: inline-block; background: #070707; color: white; 
            padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 10px; 
        }
        /* CSS เดิมของคุณ */
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }

        .sidenav { height: 100%; width: 0; position: fixed; z-index: 101; top: 0; left: 0; background-color: #111; overflow-x: hidden; transition: 0.5s; padding-top: 60px; }
        .sidenav a { padding: 15px 32px; text-decoration: none; font-size: 20px; color: #818181; display: block; transition: 0.3s; }
        .sidenav a:hover { color: #f1f1f1; }
        .sidenav .closebtn { position: absolute; top: 0; right: 25px; font-size: 36px; }

        .search-container { text-align: center; margin-bottom: 30px; }
        #searchInput { width: 80%; max-width: 400px; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 25px; outline: none; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .product-card img { max-width: 100%; border-radius: 5px; height: 200px; object-fit: cover; }

    </style>
</head>
<body>
    
<div class="menu-icon" onclick="openNav()">&#9776;</div>

<div id="mySidenav" class="sidenav">

<div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px;">
    <a href="https://www.facebook.com/share/14TMsL4xRL8/" style="text-decoration: none; color: rgb(33, 27, 27); background: #ffffff; padding: 10px 15px; border-radius: 5px; font-size: 14px;">Facebook</a>
    
    <a href="https://www.tiktok.com/@tn.store83?_r=1&_t=ZS-93AMqTfuZUK" style="text-decoration: none; color: rgb(8, 1, 1); background: #ffffff; padding: 10px 15px; border-radius: 5px; font-size: 14px;">TikTok</a>
    
    <a href="https://www.instagram.com/floralhaven_19?igsh=MW04dGgyNWtkZmI5Mw==" style="text-decoration: none; color: rgb(8, 2, 2); background: #ffffff; padding: 10px 15px; border-radius: 5px; font-size: 14px;">Instagram</a>
</div>
<header>
  <div class="logo">
    
      <img src="AAA.png" style="display:block; margin:20px auto; width:100px; height:100px; object-fit:cover; border-radius:20px; box-shadow:0 4px 8px rgba(0,0,0,0.1);">
    </a>
  </div>
</header>
<div class="container">
    <h1>ST STORE</h1>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchProduct()" placeholder="ພິມຊື່ສີນຄ້າເພື່ອຄົ້ນຫາ...">
    </div>
    <div class="search-container">
    <div class="category-box">
        <span class="category-tag" onclick="setSearch('ເສື້ອ')">ເສື້ອຜ້າ</span>
        <span class="category-tag" onclick="setSearch('ສົ່ງ')">ສົ່ງ</span>
        <span class="category-tag" onclick="setSearch('ເກີບ')">ເກີບ</span>
        <span class="category-tag" onclick="setSearch('ຂະໝົມ')">ຂະໝົມ</span>
        <span class="category-tag" onclick="setSearch('ເຄື່ອງປະດັບ')">ເຄື່ອງປະດັບ</span>
        <span class="category-tag" onclick="setSearch('')">ທັ້ງໝົດ</span>
    </div>


    <div id="productGrid" class="product-grid">
        </div>

    <div id="promo-page" style="display:none; background: white; padding: 20px; border-radius: 15px; text-align: center; margin-top: 20px; border: 2px dashed #faf8f8;">
        <h2 style="color: #000000;">ໄວໆນີ້</h2>
        <p> <b></b></p>
        
    </div>
    <footer style="text-align: center; padding: 20px; background: #fbfafa; margin-top: 20px;">📍 ຮ້ານ ST store: [laos] | โทร: [ເບີໂທລະສັບ 020 78258939 ]</footer>

</div>

<script>
    // 1. ຕັ້ງຄ່າການເຊື່ອມຕໍ່ (ເອົາແຕ່ ID ຂອງ Sheet ມາ)
const SHEET_ID = '1WrImMBQsGZcl0s6hdGoH_sl-hOHGcgLwfi0etxIMLhQ';
const SHEET_NAME = 'ชีด1'; // ຊື່ແທັບຂອງເຈົ້າ

const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;




    function fetchGoogleSheets() {
        fetch(url)
            .then(res => res.text())
            .then(data => {
                // ຕັດຂໍ້ຄວາມສ່ວນເກີນທີ່ Google ສົ່ງມາໃຫ້ເປັນ JSON ທີ່ຖືກຕ້ອງ
                const jsonData = JSON.parse(data.substring(47, data.length - 2));
                const rows = jsonData.table.rows;
                
                // ແປງຂໍ້ມູນຈາກແຕ່ລະ Row ໃຫ້ມາຢູ່ໃນຮູບແບບທີ່ Code ເຮົາເຂົ້າໃຈ
                products = rows.filter((row, index) => index > 0).map((row, index) => ({
                    id: index + 1,
                    name: row.c[0] ? row.c[0].v : '',
                    desc: row.c[1] ? row.c[1].v : '',
                    price: row.c[2] ? row.c[2].v : '',
                    img: row.c[3] ? row.c[3].v : ''
                }));

                renderProducts(); // ສະແດງຜົນສິນຄ້າທັນທີ
            })
            .catch(err => {
                console.error("Error:", err);
                document.getElementById('productGrid').innerHTML = "<p style='text-align:center;'>ບໍ່ສາມາດໂຫຼດຂໍ້ມູນໄດ້, ກະລຸນາກວດສອບການ Share Google Sheets.</p>";
            });
    }

    // 3. ຟັງຊັນສະແດງສິນຄ້າໃນໜ້າເວັບ
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        
        products.forEach((pd, index) => {
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${pd.img}" alt="${pd.name}" onerror="this.src='https://via.placeholder.com/250?text=No+Image'">
                    <h3>${pd.name}</h3>
                    <p>${pd.desc}</p>
                    <p class="price">${pd.price}</p>
                    <button class="buy-button" onclick="sendOrder(${index})">WhatsApp</button>
                </div>
            `;
        });
    }

    // 4. ຟັງຊັນສົ່ງຄຳສັ່ງຊື້ໄປ WhatsApp
    function sendOrder(index) {
        const item = products[index];
        const phoneNumber = "8562059112313";
        const message = `ສະບາຍດີ TN Store! ຂ້ອຍສົນໃຈຊື້ສິນຄ້ານີ້:\n\n` +
                        `📦 ຊື່ສິນຄ້າ: ${item.name}\n` +
                        `💰 ລາຄາ: ${item.price}\n` +
                        `📝 ລາຍລະອຽດ: ${item.desc}\n\n` +
                        `ຮູບພາບ: ${item.img}`;

        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
    }

    // 5. ຟັງຊັນຄົ້ນຫາ ແລະ ປ່ຽນໜ້າ (ໃຊ້ຂອງເດີມ)
    function searchProduct() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('product-card');
        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            cards[i].style.display = name.includes(input) ? "" : "none";
        }
    }

    function setSearch(value) {
        document.getElementById('searchInput').value = value;
        searchProduct();
    }

    function openNav() { document.getElementById("mySidenav").style.width = "250px"; }
    function closeNav() { document.getElementById("mySidenav").style.width = "0"; }

    function showPage(pageId) {
        document.getElementById('promo-page').style.display = (pageId === 'promo') ? 'block' : 'none';
        document.getElementById('productGrid').style.display = (pageId === 'home') ? 'grid' : 'none';
        document.querySelector('.search-container').style.display = (pageId === 'home') ? 'block' : 'none';
        closeNav();
    }

    // ເລີ່ມຕົ້ນດຶງຂໍ້ມູນເມື່ອເປີດເວັບ
    fetchGoogleSheets();
</script>

<audio id="myAudio" src="AAA.mp3" controls>

</audio>


<script>
    function increaseVol() {
        var audio = document.getElementById("myAudio");
        
        // ກວດສອບວ່າຫາໄຟລ໌ສຽງເຫັນບໍ່
        if (audio.readyState === 0) {
            alert("ຫາໄຟລ໌ສຽງບໍ່ເຫັນ! ກະລຸນາກວດຊື່ໄຟລ໌ music.mp3 ອີກຄັ້ງ");
            return;
        }

        if (audio.volume < 1.0) {
            audio.volume += 0.1;
            console.log("ລະດັບສຽງປະຈຸບັນ: " + audio.volume);
        }
    }
</script>
