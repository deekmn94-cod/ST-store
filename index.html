<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN STORE</title>
    <link rel="icon" type="image/png" href="mmm.jpeg">
    <!-- ນຳເຂົ້າ Font ພາສາລາວເພື່ອຄວາມສວຍງາມ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ການຕັ້ງຄ່າພື້ນຖານ (Theme & Reset) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            overflow-x: hidden;
        }

        /* --- ສ່ວນທີ 1: Header (ໂລໂກ້ + ສີຂຽວໄລ່ລະດັບສະໄຕຣ໌ກາຕູນ) --- */
        .header-section {
            background: linear-gradient(135deg, #a8ff78, #78ffd6); /* ໄລ່ເສດສີຂຽວທັນສະໄໝ */
            padding: 20px 40px;
            display: flex;
            align-items: center;
            border-bottom: 5px solid #52d681; /* ເສັ້ນຂອບສະໄຕຣ໌ກາຕູນ */
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ອະນິເມຊັນດຶງດູດສາຍຕາຂອງໂລໂກ້ເວລາ Hover */
        .logo-img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .shop-title {
            margin-left: 20px;
            font-size: 24px;
            color: #1b4d3e;
            font-weight: 700;
            text-shadow: 2px 2px 0px #fff;
        }

        /* --- ສ່ວນທີ 2: ພື້ນທີ່ສະແດງສິນຄ້າ (ສີຂາວ Clean + Grid 5x5) --- */
        .product-section {
            background: linear-gradient(180deg, #ffffff, #f7f9fa); /* ເສດສີຂາວເບິ່ງສະບາຍຕາ */
            padding: 60px 20px;
            min-height: 600px;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 40px;
            color: #333;
            font-weight: 700;
            position: relative;
        }

        /* ລະບົບ Grid ຮອງຮັບທຸກອຸປະກອນ (Responsive) */
        .product-grid {
            display: grid;
            /* ຄອມພິວເຕີຈະສະແດງເປັນ 5 ຄໍລຳ (5x5) */
            grid-template-columns: repeat(5, minmax(0, 1fr)); 
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ການຕົກແຕ່ງກາດສິນຄ້າສະໄຕຣ໌ກາຕູນ */
        .product-card {
            background: #fff;
            border: 3px solid #e2e8f0;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 0 #e2e8f0; /* ເງົາແບບ Pop-art ກາຕູນ */
            /* ອະນິເມຊັນແບບເດັ້ງ (Bouncy) ເວລາໂຫຼດ ຫຼື ປ່ຽນແປງ */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ລະບົບຊູບ (Zoom Effect) */
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 0 #cbd5e1;
            border-color: #38bdf8;
        }

        .image-box {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-radius: 15px;
            background-color: #f1f5f9;
            margin-bottom: 15px;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ຊູບຮູບພາບດ້ານໃນແບບນຸ່ມນວນ */
            transition: transform 0.3s ease; 
        }

        .product-card:hover .product-img {
            transform: scale(1.1);
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
            text-align: left;
        }

        .product-price {
            font-size: 20px;
            color: #ef4444;
            font-weight: 700;
            text-align: left;
            margin-bottom: 15px;
        }

        /* ປຸ່ມສັ່ງຊື້ */
        .buy-btn {
            background-color: #25d366; /* ສີ WhatsApp */
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #128c7e;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .buy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #128c7e;
        }

        /* --- ສ່ວນທີ 3: ທ້າຍເວັບ Footer (ສີຟ້າໄລ່ລະດັບ) --- */
        .footer-section {
            background: linear-gradient(135deg, #2193b0, #6dd5ed); /* ໄລ່ເສດສີຟ້າທັນສະໄໝ */
            color: white;
            padding: 50px 20px;
            border-top: 5px solid #34aadc;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
        }

        .footer-box h3 {
            font-size: 22px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .footer-box p, .footer-box a {
            color: #f0fdfa;
            font-size: 16px;
            line-height: 1.8;
            text-decoration: none;
        }

        .footer-bottom {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
        }

        /* --- ລະບົບ Responsive ຮອງຮັບອຸປະກອນອື່ນໆ --- */
        @media (max-width: 1200px) {
            .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (max-width: 992px) {
            .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
            .footer-content { grid-template-columns: 1fr; gap: 20px; text-align: center; }
        }
        @media (max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .header-section { padding: 15px 20px; justify-content: center; text-align: center; flex-direction: column; }
            .shop-title { margin-left: 0; margin-top: 10px; }
        }
        @media (max-width: 480px) {
            .product-grid { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }

        /* ຕົວໂຫຼດຂໍ້ມູນລະຫວ່າງລໍຖ້າ Google Sheets */
        .loading {
            text-align: center;
            font-size: 20px;
            grid-column: span 5;
            padding: 50px 0;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- ສ່ວນທີ 1: Header (ສີຂຽວ) -->
    <header class="header-section">
        <div class="logo-container">
            <!-- ໃສ່ລິ້ງຮູບພາບຂອງທ່ານຢູ່ບ່ອນ src -->
            <img src="mmm.jpeg" alt="Logo" class="logo-img">
            <h1 class="shop-title">Welcome to TN STORE </h1>
        </div>
    </header>

    <!-- ສ່ວນທີ 2: ສະແດງສິນຄ້າ (ສີຂາວ) -->
    <main class="product-section">
        <h2 class="section-title">✨ ລາຍການສິນຄ້າຂອງພວກເຮົ່າ ✨</h2>
        
        <div class="product-grid" id="productGrid">
            <div class="loading">⏳ ກຳລັງໂຫຼດຂໍ້ມູນສິນຄ້າ...</div>
        </div>
    </main>

    <!-- ສ່ວນທີ 3: Footer ທ້າຍເວັບ (ສີຟ້າ) -->
    <footer class="footer-section">
        <div class="footer-content">
            <div class="footer-box">
                <h3>ກ່ຽວກັບຮ້ານ</h3>
                <p>ສີນຄ້າທຸກຍ່າງແມ່ນພີອໍເດີແລະບໍ່ມີການເກັບເງີນປາຍທາງ</p>
            </div>
            <div class="footer-box">
                <h3>ຊ່ອງທາງຕິດຕໍ່</h3>
                <p>📍 ທີ່ຕັ້ງ: ນະຄອນຫຼວງວຽງຈັນ</p>
                <p>📞 ເບີໂທ: +856 20 59 112 313</p>
            </div>
            <div class="footer-box">
                <h3>ຕິດຕາມພວກເຮົາ</h3>
                <p><a href="#">Facebook Page</a></p>
                <p><a href="#">Instagram</a></p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 TN STORE.</p>
        </div>
    </footer>

    <!-- --- ລະບົບເຊື່ອມຕໍ່ກູເກິລຊີດ & WhatsApp --- -->
    <script>
        // 1. ຕັ້ງຄ່າຂໍ້ມູນຂອງທ່ານຢູ່ບ່ອນນີ້
        const WHATSAPP_NUMBER = "8562059112313"; // ໃສ່ເບີ WhatsApp ຂອງທ່ານ (ມີລະຫັດປະເທດ 856 ຕັດ 0 ທາງໜ້າອອກ)
        const SHEET_ID = "1WrImMBQsGZcl0s6hdGoH_sl-hOHGcgLwfi0etxIMLhQ"; // ໃສ່ ID ຂອງ Google Sheet ຂອງທ່ານ
        
        // ລິ້ງດຶງຂໍ້ມູນຈາກ Google Sheet ເປັນ JSON
       // ໃຊ້ SHEET_ID ມາປະກອບເປັນລິ້ງ API
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
        async function fetchProducts() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                
                // ຕັດຂໍ້ມູນສ່ວນເກີນທີ່ Google ສົ່ງມາເພື່ອໃຫ້ເປັນ JSON ທີ່ສົມບູນ
                const jsonData = JSON.parse(text.substring(47, text.length - 2));
                const rows = jsonData.table.rows;
                
                const productGrid = document.getElementById('productGrid');
                productGrid.innerHTML = ''; // ລຶບຕົວໂຫຼດອອກ
c
                // ວົນລູບສະແດງຜົນສິນຄ້າ
                // ສົມມຸດວ່າ: ຄໍລຳ A = ຊື່ສິນຄ້າ, ຄໍລຳ B = ລາຄາ, ຄໍລຳ C = ລິ້ງຮູບພາບ (URL)
                rows.forEach(row => {
                    const name = row.c[0] ? row.c[0].v : 'ບໍ່ມີຊື່ສິນຄ້າ';
                    const price = row.c[1] ? row.c[1].v : '0';
                    const imgUrl = row.c[2] ? row.c[2].v : 'https://via.placeholder.com/300';

                    // ຂໍ້ຄວາມທີ່ຈະສົ່ງເຂົ້າ WhatsApp ເວລາກົດສັ່ງຊື້
                    const message = encodeURIComponent(`ສະບາຍດີ! ຂ້ອຍສົນໃຈສັ່ງຊື້ສິນຄ້າ: ${name} \nລາຄາ: ${price}`);
                    const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                    // ສ້າງກາດສິນຄ້າ HTML
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <div class="image-box">
                                <img src="${imgUrl}" alt="${name}" class="product-img">
                            </div>
                            <div class="product-name">${name}</div>
                            <div class="product-price">${Number(price).toLocaleString()} ກີບ</div>
                        </div>
                        <button class="buy-btn" onclick="window.open('${whatsappLink}', '_blank')">
                            🛒 ສັ່ງຊື້ທາງ WhatsApp
                        </button>
                    `;
                    productGrid.appendChild(card);
                });

            } catch (error) {
                console.error("เกิดข้อผิดพลาด:", error);
                document.getElementById('productGrid').innerHTML = `<div class="loading" style="color:red;">❌ ບໍ່ສາມາດໂຫຼດຂໍ້ມູນໄດ້ ກະລຸນາລໍຖ້າ</div>`;
            }
        }

        // ໃຫ້ລະບົບເຮັດງານທັນທີທີ່ເປີດໜ້າເວັບ
        fetchProducts();
    </script>
</body>
</html>
